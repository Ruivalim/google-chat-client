name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Never paste tokens, client secrets or the contents of your OAuth JSON here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. The error message the app showed helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Linux, Windows, macOS]
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, version on Windows and macOS, and how you installed (AppImage, .deb, installer, .dmg).
  - type: dropdown
    id: audience
    attributes:
      label: Google Cloud project audience
      options: [External (testing), External (production), Internal, Not sure]
