name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Webview do sistema, que o gerador da ponte carrega
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: make check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  package:
    name: pacote ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, platform: linux/amd64, out: build/linux-amd64 }
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64, out: build/windows-amd64 }
          - { name: macOS, os: macos-latest, platform: darwin/universal, out: build/darwin-universal }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Webview do sistema, que o gerador da ponte carrega
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: NSIS, para o instalador do Windows
        if: matrix.name == 'Windows'
        run: sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run build -- -platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: google-chat-client-${{ matrix.name }}
          path: ${{ matrix.out }}
          retention-days: 14
