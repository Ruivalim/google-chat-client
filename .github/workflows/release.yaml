name: Release

# Uma tag v<versão> publica o release com os pacotes dos três sistemas. A
# versão da tag tem que ser a de mygo.config.ts, e o CHANGELOG.md tem que ter
# a seção dela, que vira as notas do release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag já enviada a publicar, como v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag, versão e CHANGELOG combinam
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mygo.config.ts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::a tag $TAG não é a versão de mygo.config.ts (v$version)"
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md não tem a seção ## $version"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Webview do sistema, que o gerador da ponte carrega
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: make check

  package:
    name: pacote ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, platform: linux/amd64 }
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64 }
          - { name: macOS, os: macos-latest, platform: darwin/universal }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Webview do sistema, que o gerador da ponte carrega
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: NSIS, para o instalador do Windows
        if: matrix.name == 'Windows'
        run: sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run build -- -platform "${{ matrix.platform }}"
      - name: AppImage
        if: matrix.name == 'Linux'
        run: scripts/appimage.sh
      - name: Junta os arquivos com nomes sem espaço
        shell: bash
        run: |
          set -euo pipefail
          v=${TAG#v}
          mkdir -p release
          case "${{ matrix.name }}" in
            Linux)
              cp "build/linux-amd64/Google_Chat_Client-$v-x86_64.AppImage" release/
              cp "build/linux-amd64/google-chat-client_${v}_amd64.deb" release/
              cp "build/linux-amd64/google-chat-client-$v-linux-amd64.tar.gz" release/
              ;;
            Windows)
              cp "build/windows-amd64/Google Chat Client Setup $v amd64.exe" "release/Google-Chat-Client-Setup-$v-windows-amd64.exe"
              cp "build/windows-amd64/Google Chat Client.exe" "release/Google-Chat-Client-$v-windows-amd64-portable.exe"
              ;;
            macOS)
              dmg=$(find build -maxdepth 2 -name '*.dmg' | head -1)
              test -n "$dmg"
              cp "$dmg" "release/Google-Chat-Client-$v-macos-universal.dmg"
              ;;
          esac
          ls -la release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publica o release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Cria o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=${TAG#v}
          awk -v h="## $v" '$0 == h {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          The packages are not signed yet: see the README for the Windows SmartScreen and macOS Gatekeeper prompts. Google Chat is a trademark of Google LLC; this app is not affiliated with Google.
          NOTES
          (cd release && sha256sum -- ./* > SHA256SUMS.txt)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md release/*
